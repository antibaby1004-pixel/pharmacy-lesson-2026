<script src="../timing.js"></script><script src="../../../lib/core.js"></script><script>useTiming('inj');const $i=i=>document.getElementById(i);

 const ins=ease(seg(o,15.2,16.0)),push=seg(o,19.6,23.0),out=ease(seg(o,24.2,25.4)),grd=seg(o,25.6,27.0);
 $i('h4s').setAttribute('transform',`translate(${lerp(560,430,ins)+out*90} ${lerp(260,390,ins)-out*90})`);st($i('h4s'),{cov:0,push,guard:grd});$i('d45').style.opacity=seg(o,14.6,15.0)*(1-seg(o,18.6,19.0));
